name: Homelab Status

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check services
        run: bash scripts/check-homelab.sh resources/homelab-status.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/homelab-status.json
          if git diff --staged --quiet; then
            echo "No status changes."
          else
            git commit -m "chore: update homelab status"
            git push
          fi
