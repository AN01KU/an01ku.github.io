<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup Evolution — Ankush Ganesh</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .setup-page {
      min-height: 100vh;
      padding: 2rem 1.5rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .setup-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 2rem;
      transition: opacity 0.2s ease;
    }

    .setup-back:hover {
      opacity: 0.7;
    }

    .setup-page .section-header {
      margin-bottom: 2.5rem;
    }

    .setup-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .setup-item {
      background: var(--bg-secondary);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-light);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .setup-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
    }

    .setup-image-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      background: var(--border-light);
    }

    .setup-image-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .setup-item:hover .setup-image-container img {
      transform: scale(1.03);
    }

    .setup-date-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.75rem 1rem;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      color: white;
      font-size: 0.875rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="setup-page">
    <a href="../index.html" class="setup-back">← Back to Portfolio</a>

    <div class="section-header">
      <h2>Setup Evolution</h2>
      <p class="section-subtitle">The journey of my workspace over time</p>
    </div>

    <div class="setup-gallery" id="setup-gallery"></div>
  </div>

  <script>
    // Theme
    const html = document.documentElement;
    const currentTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', currentTheme);

    const setupImages = [
      { file: 'IMG_20230825_200459808.jpg', date: 'August 25, 2023' },
      { file: 'IMG_20230825_200631819.jpg', date: 'August 25, 2023' },
      { file: 'IMG_20231010_221230100.jpg', date: 'October 10, 2023' },
      { file: 'IMG_20240412_212234033.jpg', date: 'April 12, 2024' },
      { file: 'IMG_20240419_214143308.jpg', date: 'April 19, 2024' },
      { file: 'IMG_20240622_231211952.jpg', date: 'June 22, 2024' },
      { file: 'IMG_20240623_183622804.jpg', date: 'June 23, 2024' },
      { file: 'IMG_20240623_183716454.jpg', date: 'June 23, 2024' },
      { file: 'IMG_20250122_005830900.jpg', date: 'January 22, 2025' },
      { file: 'IMG_20250420_212308174.jpg', date: 'April 20, 2025' },
      { file: 'IMG_20250518_010528822.jpg', date: 'May 18, 2025' },
      { file: 'IMG_20250518_010533647.jpg', date: 'May 18, 2025' },
      { file: 'IMG_20250702_225641914.jpg', date: 'July 2, 2025' },
      { file: 'IMG_20250716_202506504.jpg', date: 'July 16, 2025' },
      { file: 'IMG_20250717_120201767.jpg', date: 'July 17, 2025' },
      { file: 'IMG_20250817_112755900.jpg', date: 'August 17, 2025' },
      { file: 'IMG_20250817_112835249.jpg', date: 'August 17, 2025' },
      { file: 'IMG_20250915_122948786.jpg', date: 'September 15, 2025' },
      { file: 'IMG_20250924_230317940.jpg', date: 'September 24, 2025' },
      { file: 'IMG_20251122_220728177.jpg', date: 'November 22, 2025' }
    ];

    setupImages.sort((a, b) => new Date(b.date) - new Date(a.date));

    const gallery = document.getElementById('setup-gallery');

    setupImages.forEach(img => {
      const item = document.createElement('div');
      item.className = 'setup-item';
      item.innerHTML = `
        <div class="setup-image-container">
          <img src="../resources/pc-setup/${img.file}" alt="Setup ${img.date}" loading="lazy" />
          <div class="setup-date-overlay">${img.date}</div>
        </div>
      `;
      gallery.appendChild(item);
    });
  </script>

</body>
</html>
